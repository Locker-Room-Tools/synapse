[project]
name = "synapse-mcp"
version = "0.2.4"
description = "Local-first AST-based code context engine exposed over MCP."
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.27,<2",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.8,<1.9",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
synapse = "synapse.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
