[project]
name = "locker-room-tools-synapse-mcp"
version = "0.4.0"
description = "Local-first AST-based code context engine exposed over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Skr0ls", email = "lpdimakot11@gmail.com" }]
keywords = ["mcp", "tree-sitter", "code-index", "ast", "ai-agents", "code-context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27,<2",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=1.13.3,<1.14",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Locker-Room-Tools/synapse"
Repository = "https://github.com/Locker-Room-Tools/synapse"
Issues = "https://github.com/Locker-Room-Tools/synapse/issues"
Changelog = "https://github.com/Locker-Room-Tools/synapse/blob/main/CHANGELOG.md"

[project.scripts]
synapse = "synapse.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]
include = ["src/synapse/core/default_ignored_directories.json"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["synapse"]

[tool.coverage.report]
fail_under = 85
show_missing = true
