version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # mcp 2.x renames the FastMCP server API; upgrading is a planned code
      # migration, not a dependency bump (see PR #14).
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
