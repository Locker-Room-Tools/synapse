name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install tree-sitter grammars
        run: .venv/bin/python -m synapse grammars install
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest with coverage floor
        run: uv run pytest -q --cov=synapse

  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Tag must match the project version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match project version ${version}" >&2
            exit 1
          }
      - name: Build sdist and wheel
        run: uv build
      - name: Wheel must contain query and adapter data
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          scm = [n for n in names if n.endswith(".scm")]
          adapters = [n for n in names if "/adapters/" in n]
          print(f"{len(scm)} .scm files, {len(adapters)} adapter files in {wheel}")
          sys.exit(0 if len(scm) >= 100 and adapters else 1)
          EOF
      - name: Install wheel into a fresh venv and index a real project
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/synapse grammars install
          /tmp/smoke-venv/bin/synapse index .
          /tmp/smoke-venv/bin/synapse --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
