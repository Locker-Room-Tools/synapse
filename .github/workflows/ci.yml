name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest with coverage floor
        if: runner.os != 'Windows'
        run: uv run pytest -q --cov=synapse
      - name: Pytest with coverage floor (Windows)
        if: runner.os == 'Windows'
        env:
          PYTHONFAULTHANDLER: "1"
        shell: pwsh
        run: >-
          & .venv\Scripts\python.exe -X faulthandler -m pytest -n 8 --dist load
          -vv --full-trace --cov=synapse

  packaging-smoke:
    name: Packaging smoke (installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build
      - name: Wheel must contain query and adapter data
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          scm = [n for n in names if n.endswith(".scm")]
          adapters = [n for n in names if "/adapters/" in n]
          print(f"{len(scm)} .scm files, {len(adapters)} adapter files in {wheel}")
          sys.exit(0 if len(scm) >= 100 and adapters else 1)
          EOF
      - name: Install wheel into a fresh venv and index a real project
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/synapse index .
          /tmp/smoke-venv/bin/synapse --version
