name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install tree-sitter grammars
        run: .venv/bin/python -m synapse grammars install
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest with coverage floor
        run: uv run pytest -q --cov=synapse

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Audit for known vulnerabilities
        run: uvx pip-audit --skip-editable --path .venv/lib/python*/site-packages

  windows-test:
    name: Test (Windows, ${{ matrix.shard }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: CLI and MCP
            tests: tests/cli tests/mcp tests/test_smoke.py
          - shard: core queries
            tests: >-
              tests/core/config tests/core/index tests/core/languages
              tests/core/test_lifecycle.py tests/core/test_models.py
              tests/core/test_workspace.py
          - shard: indexing lifecycle
            tests: >-
              tests/core/indexing/test_pipeline.py
              tests/core/indexing/test_crawler.py
          - shard: base parsers
            tests: >-
              tests/core/indexing/test_parser.py
              tests/core/indexing/test_parser_edge_cases.py
          - shard: parser tiers
            tests: >-
              tests/core/indexing/test_parser_tier2.py
              tests/core/indexing/test_parser_tier3.py
              tests/core/indexing/test_parser_tier4.py
              tests/core/indexing/test_parser_tier5.py
          - shard: watch
            tests: tests/core/watch
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install tree-sitter grammars
        shell: cmd
        run: start "" /wait /b .venv\Scripts\python.exe -m synapse grammars install
      - name: Pytest with coverage
        env:
          PYTHONFAULTHANDLER: "1"
        shell: cmd
        run: >-
          start "" /wait /b .venv\Scripts\python.exe -X faulthandler -m pytest
          -vv --full-trace --cov=synapse --cov-report= --cov-fail-under=0
          ${{ matrix.tests }}

  packaging-smoke:
    name: Packaging smoke (installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build
      - name: Wheel must contain query and adapter data
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          scm = [n for n in names if n.endswith(".scm")]
          adapters = [n for n in names if "/adapters/" in n]
          skills = [n for n in names if n.endswith("/skills/synapse-code-context/SKILL.md")]
          print(
              f"{len(scm)} .scm files, {len(adapters)} adapter files, "
              f"{len(skills)} managed skills in {wheel}"
          )
          sys.exit(0 if len(scm) >= 100 and adapters and skills else 1)
          EOF
      - name: Install wheel into a fresh venv and index a real project
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/synapse --help
          CODEX_HOME=/tmp/smoke-codex /tmp/smoke-venv/bin/synapse install codex --dry-run
          /tmp/smoke-venv/bin/synapse init --path . --dry-run
          /tmp/smoke-venv/bin/synapse grammars install
          /tmp/smoke-venv/bin/synapse index .
          /tmp/smoke-venv/bin/synapse --version
