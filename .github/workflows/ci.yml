name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (Ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install tree-sitter grammars
        run: .venv/bin/python -m synapse grammars install
      - name: Ruff lint
        run: uv run ruff check
      - name: Ruff format check
        run: uv run ruff format --check
      - name: Mypy
        run: uv run mypy
      - name: Pytest with coverage floor
        run: uv run pytest -q --cov=synapse

  windows-test:
    name: Test (Windows, ${{ matrix.shard }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: CLI and MCP
            tests: tests/cli tests/mcp tests/test_smoke.py
          - shard: core index
            tests: >-
              tests/core/test_config.py tests/core/test_crawler.py
              tests/core/test_grammars.py tests/core/test_index.py
              tests/core/test_index_lifecycle.py tests/core/test_indexing.py
              tests/core/test_models.py tests/core/test_workspace.py
          - shard: base parsers
            tests: >-
              tests/core/test_languages.py tests/core/test_parser.py
              tests/core/test_parser_edge_cases.py
          - shard: parser tiers
            tests: >-
              tests/core/test_parser_tier2.py tests/core/test_parser_tier3.py
              tests/core/test_parser_tier4.py tests/core/test_parser_tier5.py
              tests/core/test_queries.py
          - shard: watch
            tests: tests/core/watch
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install tree-sitter grammars
        shell: pwsh
        run: .venv\Scripts\python.exe -m synapse grammars install
      - name: Pytest with coverage
        env:
          PYTHONFAULTHANDLER: "1"
        shell: pwsh
        run: >-
          & .venv\Scripts\python.exe -X faulthandler -m pytest
          -vv --full-trace --cov=synapse --cov-report= --cov-fail-under=0
          ${{ matrix.tests }}

  packaging-smoke:
    name: Packaging smoke (installed wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: uv build
      - name: Wheel must contain query and adapter data
        run: |
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          scm = [n for n in names if n.endswith(".scm")]
          adapters = [n for n in names if "/adapters/" in n]
          print(f"{len(scm)} .scm files, {len(adapters)} adapter files in {wheel}")
          sys.exit(0 if len(scm) >= 100 and adapters else 1)
          EOF
      - name: Install wheel into a fresh venv and index a real project
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/synapse grammars install
          /tmp/smoke-venv/bin/synapse index .
          /tmp/smoke-venv/bin/synapse --version
