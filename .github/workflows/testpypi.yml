name: TestPyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install tree-sitter grammars
        run: .venv/bin/python -m synapse grammars install
      - name: Quality gate
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run mypy
          uv run pytest -q --cov=synapse
      - name: Build sdist and wheel
        run: uv build
      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  validate:
    name: Validate TestPyPI installation
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Install exact TestPyPI release and smoke test it
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          uv venv /tmp/testpypi-smoke
          uv pip install --python /tmp/testpypi-smoke/bin/python \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "locker-room-tools-synapse-mcp==${version}"
          /tmp/testpypi-smoke/bin/synapse --help
          CODEX_HOME=/tmp/testpypi-codex /tmp/testpypi-smoke/bin/synapse install codex --dry-run
          /tmp/testpypi-smoke/bin/synapse init --path . --dry-run
          /tmp/testpypi-smoke/bin/synapse grammars install
          /tmp/testpypi-smoke/bin/synapse --version
          /tmp/testpypi-smoke/bin/synapse index .
          /tmp/testpypi-smoke/bin/synapse doctor --path . --json
